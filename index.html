<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolkit · Share Your Bilingual Superpower!</title>
<style>
:root{
  --navy:#0B2545; --navy2:#13315C; --blue:#1F5FA8; --sky:#BCD3EE; --pale:#EAF1FA; --pale2:#F5F8FC;
  --ink:#1B2733; --muted:#5B6B7F; --line:#D5DFEC; --warn:#FFF6DA; --gold:#E2B93B; --white:#fff;
  --head:Cambria, Georgia, "Times New Roman", serif;
  --body:Calibri, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.5;color:var(--ink);background:var(--white)}
h1,h2,h3{font-family:var(--head);color:var(--navy);line-height:1.2;margin:0}
h2{font-size:30px;margin-bottom:6px} h3{font-size:20px;margin:28px 0 8px;color:var(--blue)}
p{margin:0 0 12px} a{color:var(--blue)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
.sr{position:absolute;left:-9999px}

/* traducción */
.tr{border-radius:3px}
body.hov .tr:hover{background:rgba(31,95,168,.10);text-decoration:underline dotted var(--blue);text-underline-offset:3px;cursor:help}
#tip{position:fixed;z-index:50;max-width:360px;background:var(--navy);color:#fff;font-size:14.5px;line-height:1.45;padding:9px 12px;border-radius:8px;box-shadow:0 6px 24px rgba(11,37,69,.35);pointer-events:none;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#tip b{display:inline-block;background:var(--gold);color:var(--navy);font-size:11px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;margin-right:7px;vertical-align:1px}

/* portada */
#home{min-height:100vh;background:var(--navy);color:#fff;display:flex;flex-direction:column}
.home-top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 6vw}
.home-top img{display:block}
.logo-cng{height:64px}.logo-amisa{height:64px}
.home-main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2vh 6vw 6vh;max-width:1100px}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:18px}
#home h1{color:#fff;font-size:clamp(36px,6vw,64px);margin-bottom:18px}
.lead{font-size:clamp(18px,2.2vw,22px);color:var(--sky);max-width:760px;margin-bottom:12px}
.subtitle{font-family:var(--head);font-style:italic;color:#fff;opacity:.85;max-width:760px;margin-bottom:30px}
.tools4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:900px;margin:0 0 34px;padding:0;list-style:none}
.tools4 li{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:12px 14px;font-size:15px}
.tools4 span.n{font-family:var(--head);font-size:22px;color:var(--gold);display:block}
.btn-main{align-self:flex-start;background:#fff;color:var(--navy);border:0;border-radius:8px;font-weight:700;font-size:18px;padding:13px 26px}
.btn-main:hover{background:var(--pale)}
.home-foot{padding:18px 6vw 26px;color:var(--sky);font-size:14.5px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between;align-items:center}
.lang-home{display:flex;gap:10px;align-items:center}

/* barra de control */
#app{display:none}
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff}
.topbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px}
.brand{background:none;border:0;color:#fff;font-family:var(--head);font-size:18px;padding:4px 0;text-align:left}
.ctrls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:#fff;border:0;padding:5px 14px;font-weight:600;font-size:15px}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy)}
.sw{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--sky);cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--gold)}
.stepper{background:var(--pale2);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:19}
.stepper-in{max-width:1100px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 20px;scrollbar-width:thin}
.stepper button{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);color:var(--navy);padding:7px 13px;border-radius:999px;font-size:15px;white-space:nowrap}
.stepper button b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pale);font-size:13px}
.stepper button[aria-current=step]{background:var(--navy);color:#fff;border-color:var(--navy)}
.stepper button[aria-current=step] b{background:#fff;color:var(--navy)}
.stepper button.done b{background:var(--blue);color:#fff}
main{max-width:1100px;margin:0 auto;padding:26px 20px 40px}
.hint{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;background:var(--pale);border:1px solid var(--sky);border-radius:10px;padding:10px 14px;margin-bottom:22px;font-size:15px}
.hint button{background:none;border:0;color:var(--blue);font-weight:700;white-space:nowrap}
.lede{font-size:19px;color:var(--muted);max-width:760px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}
.card.pale{background:var(--pale2)}
.note{background:var(--warn);border:1px solid #EBD98E;border-radius:10px;padding:11px 14px;margin:14px 0;font-size:15.5px}
.box{background:var(--pale);border-radius:10px;padding:14px 18px;margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:15.5px;margin:10px 0 16px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:600}
td.k{background:var(--pale2);font-weight:700}
.tablewrap{overflow-x:auto}
ul.plain{padding-left:20px;margin:0 0 12px} ul.plain li{margin-bottom:5px}
ul.checks{list-style:none;padding:0;margin:0 0 12px}
ul.checks li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--pale)}
ul.checks input{width:20px;height:20px;margin-top:3px;accent-color:var(--blue);flex:0 0 auto}
ul.checks label{cursor:pointer;flex:1}
ul.checks li.on label{color:var(--muted);text-decoration:line-through}
input[type=text],textarea,select{font:inherit;width:100%;padding:8px 10px;border:1px solid #AEBFD6;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-weight:700;font-size:14.5px;color:var(--navy);margin:0 0 4px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600;font-size:15.5px}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.ghost:hover{background:var(--pale)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.tabs2 button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 14px;color:var(--navy);font-weight:600}
.tabs2 button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.scale{display:grid;gap:6px;margin:6px 0 14px}
.scale div{display:flex;gap:12px;align-items:center;border-radius:8px;padding:8px 12px}
.scale b{font-family:var(--head);font-size:22px;width:24px}
.l1{background:#DCE7F5}.l2{background:#A9C6E8}.l3{background:#5C93D1;color:#fff}.l4{background:#1F5FA8;color:#fff}
.lv{display:inline-flex;gap:6px}
.lv button{width:42px;height:38px;border:1px solid #AEBFD6;border-radius:8px;background:#fff;font-weight:700;color:var(--navy)}
.lv button[aria-pressed=true].p1{background:#DCE7F5;border-color:var(--navy)}
.lv button[aria-pressed=true].p2{background:#A9C6E8;border-color:var(--navy)}
.lv button[aria-pressed=true].p3{background:#5C93D1;color:#fff;border-color:var(--navy)}
.lv button[aria-pressed=true].p4{background:#1F5FA8;color:#fff;border-color:var(--navy)}
.curve{display:flex;gap:10px;align-items:flex-end;height:150px;margin:12px 0 4px;border-bottom:1px solid var(--muted)}
.curve div{flex:1;border-radius:6px 6px 0 0;min-height:4px;position:relative;text-align:center}
.curve span{position:absolute;top:-22px;left:0;right:0;font-weight:700;font-size:14px;color:var(--navy)}
.curvelab{display:flex;gap:10px;font-size:12.5px;color:var(--muted)}
.curvelab div{flex:1;text-align:center}
td.pick{cursor:pointer}
td.pick:hover{background:var(--pale)}
td.pick.sel{background:var(--blue);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 16px}
.chips button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 13px;color:var(--navy);font-size:15px}
.chips button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.qlayout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.q{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.q button{flex:0 0 auto;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;padding:3px 10px;font-weight:700;font-size:14px}
.q.sel{background:var(--pale);border-color:var(--blue)}
.q.sel button{background:var(--blue);color:#fff}
.q .cat{font-size:12.5px;color:var(--muted);display:block}
.side{position:sticky;top:130px}
.side ol{padding-left:22px;margin:8px 0}
.side li{margin-bottom:6px}
.side li button{border:0;background:none;color:#9A3412;font-weight:700;margin-left:6px}
.count.ok{color:#14653A}.count.warn{color:#9A3412}
.mail{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:16px}
.phases{display:grid;gap:6px;margin:8px 0}
.ph{display:grid;grid-template-columns:70px 1fr 160px;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.ph.now{background:var(--blue);color:#fff;border-color:var(--blue)}
.ph.past{opacity:.55}
.ph .m{font-weight:700;font-family:var(--head)}
.timer{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:12px;padding:12px 18px;margin:12px 0}
.timer .big{font-family:var(--head);font-size:44px;line-height:1}
.timer .btn{background:#fff;color:var(--navy)}
.bars2{display:grid;gap:14px;margin-top:10px}
.bars2 .it{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:center}
.bar{height:20px;border-radius:5px;display:flex;align-items:center;padding-left:8px;font-size:13px;font-weight:700;color:#fff;min-width:28px}
.bar.in{background:#7F9CC0}.bar.out{background:var(--blue)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.prog{color:var(--muted);font-size:15px}
.tiny{font-size:14px;color:var(--muted)}
.fig{max-width:360px;border:1px solid var(--line);border-radius:10px;display:block}
.srcs li{margin-bottom:12px}
.emo-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fff}
.emo-card h4{font-family:var(--head);font-size:19px;color:var(--navy);margin:0 0 2px}
.emo-opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.emo-opts button{text-align:left;border:1px solid #AEBFD6;background:#fff;border-radius:10px;padding:10px 12px;color:var(--ink);font-size:16px;line-height:1.35}
.emo-opts button b{display:block;font-family:var(--head);font-size:18px;margin-bottom:2px}
.emo-opts button:hover{background:var(--pale)}
.emo-opts button[aria-pressed=true].e1{background:#DCE7F5;border-color:var(--navy)}
.emo-opts button[aria-pressed=true].e2{background:#A9C6E8;border-color:var(--navy)}
.emo-opts button[aria-pressed=true].e3{background:#5C93D1;color:#fff;border-color:var(--navy)}
.emo-opts button[aria-pressed=true].e4{background:#1F5FA8;color:#fff;border-color:var(--navy)}
.words{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.words button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--navy);font-size:15px}
.words button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (max-width:1000px){.emo-opts{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.emo-opts{grid-template-columns:1fr}}
@media (max-width:820px){
  .grid2,.qlayout{grid-template-columns:1fr}.side{position:static}
  .tools4{grid-template-columns:1fr 1fr}
  .ph{grid-template-columns:56px 1fr}.ph>:last-child{grid-column:1/-1}
  .bars2 .it{grid-template-columns:1fr}
  .stepper{top:101px}
  .logo-cng,.logo-amisa{height:48px}
}
@media print{
  .topbar,.stepper,.pager,.hint,.btns,.tabs2,.chips,#tip,.noprint{display:none!important}
  body{font-size:12pt}
  main{padding:0}
  .side{position:static}
}
</style>

function mailText(){
 const m=LS.get('mail',{});
 const g=m.guest||'[nombre]',me=m.me||'[nombre]',d=m.date||'[fecha]',h=m.time||'[hora]',du=m.dur||'[20 a 30]',lg=m.lang||'[lengua]';
 if(lang==='es') return `Asunto: Invitación a contar cómo aprendió otra lengua (${du} minutos)

Hola ${g}:

Soy ${me}, docente de español como nueva lengua en secundaria. Mis estudiantes de 6.º a 8.º sienten pena y frustración cuando hablan español, y quisiera que escucharan a una persona del colegio que pasó por lo mismo.

¿Podría visitar mi clase el ${d} a las ${h} durante ${du} minutos? Los estudiantes le harán preguntas sobre cómo fue aprender ${lg}: la pena, los errores y lo que le ayudó. No necesita preparar una presentación. Solo contar su experiencia con sinceridad. Si quiere, le envío las preguntas con anticipación.

Gracias por considerarlo.

${me}`;
 return `Subject: Invitation to share how you learned another language (${du} minutes)

Hello ${g},

I am ${me}, a Spanish as a New Language teacher in middle school. My students in grades 6–8 feel embarrassment and frustration when they speak Spanish, and I would like them to hear from someone at our school who has been through the same thing.

Could you visit my class on ${d} at ${h} for ${du} minutes? The students will ask you about what it was like to learn ${lg}: the embarrassment, the mistakes and what helped. You do not need to prepare a presentation. Just tell your experience honestly. If you wish, I can send you the questions in advance.

Thank you for considering it.

${me}`;
}
function thanksText(){
 const t=LS.get('thanks',{});
 const g=t.guest||'[nombre]',me=t.me||'[nombre]',d=t.date||'[fecha]',ph=t.phrase||'[frase de los estudiantes]',st=t.str||'[estrategia]';
 if(lang==='es') return `Asunto: Gracias por venir a mi clase

Hola ${g}:

Gracias por venir a mi clase de español como nueva lengua el ${d}. Mis estudiantes le preguntaron cómo aprendió otra lengua y usted les contó.

Esto escribió uno de ellos: “${ph}”

La estrategia suya que quedó anotada en nuestro muro: ${st}.

Le entrego las tarjetas que escribieron. Si quiere, en unas semanas le cuento cómo les fue al probarla.

Gracias por su tiempo.

${me}`;
 return `Subject: Thank you for coming to my class

Hello ${g},

Thank you for coming to my Spanish as a New Language class on ${d}. My students asked you how you learned another language and you told them.

One of them wrote: “${ph}”

Your strategy that is now on our wall: ${st}.

I am handing you the cards they wrote. If you wish, in a few weeks I can tell you how they did when they tried it.

Thank you for your time.

${me}`;
}

 <div class="btns noprint"><button class="btn" id="fi-copy">${T('Copiar ficha','Copy profile')}</button></div>

 <h3>${T('5. Guía de preparación para el invitado','5. Preparation guide for the guest')}</h3>

 <div class="box"><strong>${T('Para la tarjeta, frases de arranque:','For the card, sentence starters:')}</strong> ${STARTERS.map(s=>`“${T(s.es,s.en)}”`).join(' · ')}</div>

let timer={run:false,left:PHASES.reduce((a,p)=>a+p.m,0)*60,iv:null};
VIEWS.ses=()=>{
 const chk=LS.get('chk',{}); const reg=LS.get('reg',[]);
 const list=(arr)=>`<ul class="checks">${arr.map(i=>`<li class="${chk[i.id]?'on':''}"><input type="checkbox" id="${i.id}" data-chk="${i.id}" ${chk[i.id]?'checked':''}><label for="${i.id}"><strong>${T(i.w.es,i.w.en)}:</strong> ${T(i.t.es,i.t.en)}</label></li>`).join('')}</ul>`;
 return `
 <h2>${T('Protocolo de sesión','Session protocol')}</h2>
 <p class="lede">${T('Antes, durante y después de cada visita, con roles y registro.','Before, during and after each visit, with roles and a log.')}</p>
 <h3>${T('Antes','Before')}</h3>${list(BEFORE)}
 <h3>${T('Durante (sesión sugerida de 40 minutos)','During (suggested 40-minute session)')}</h3>
 <div class="timer noprint"><div class="big" id="tm">--:--</div><div id="tph" style="flex:1;min-width:200px"></div>
  <button class="btn" id="tm-go">${T('Iniciar','Start')}</button><button class="btn" id="tm-reset">${T('Reiniciar','Reset')}</button></div>
 <div class="phases" id="phases"></div>
 <h3>${T('Roles','Roles')}</h3>
 <ul class="plain">${ROLES.map(r=>`<li><strong>${T(r.n.es,r.n.en)}:</strong> ${T(r.t.es,r.t.en)}</li>`).join('')}</ul>
 <h3>${T('Después','Afterwards')}</h3>${list(AFTER)}
 <h3>${T('Registro de sesión','Session log')}</h3>
 <p>${T('Anota cada visita. Estos datos alimentan el paso Medir.','Record each visit. This data feeds the Measure step.')}</p>
 <div class="row">
  <div><label class="f" for="r-date">${T('Fecha','Date')}</label><input type="text" id="r-date" placeholder="2026-11-09"></div>
  <div><label class="f" for="r-guest">${T('Invitado y lenguas','Guest and languages')}</label><input type="text" id="r-guest"></div>
  <div><label class="f" for="r-str">${T('Estrategias del muro','Strategies from the wall')}</label><input type="text" id="r-str"></div>
  <div><label class="f" for="r-in">${T('Termómetro promedio de entrada (1–4)','Average entry thermometer (1–4)')}</label><input type="text" id="r-in" inputmode="decimal"></div>
  <div><label class="f" for="r-out">${T('Termómetro promedio de salida (1–4)','Average exit thermometer (1–4)')}</label><input type="text" id="r-out" inputmode="decimal"></div>
  <div><label class="f" for="r-com">${T('Comentarios espontáneos (textuales)','Spontaneous comments (verbatim)')}</label><input type="text" id="r-com"></div>
 </div>
 <div class="btns noprint"><button class="btn" id="r-add">${T('Agregar al registro','Add to log')}</button><button class="btn ghost" id="r-csv">${T('Descargar CSV','Download CSV')}</button><button class="btn ghost" id="r-clear">${T('Borrar registro','Clear log')}</button></div>
 <div class="tablewrap"><table><thead><tr><th>${T('Fecha','Date')}</th><th>${T('Invitado','Guest')}</th><th>${T('Estrategias','Strategies')}</th><th>${T('Entrada','Entry')}</th><th>${T('Salida','Exit')}</th><th>${T('Cambio','Change')}</th><th>${T('Comentarios','Comments')}</th></tr></thead><tbody>
 ${reg.length?reg.map(r=>{const d=(r.o!=null&&r.i!=null)?(r.o-r.i):null;return `<tr><td>${esc(r.d)}</td><td>${esc(r.g)}</td><td>${esc(r.s)}</td><td>${r.i??''}</td><td>${r.o??''}</td><td>${d==null?'':(d>0?'+':'')+d.toFixed(1)}</td><td>${esc(r.c)}</td></tr>`}).join(''):`<tr><td colspan="7" class="tiny">${T('Aún no hay visitas registradas.','No visits logged yet.')}</td></tr>`}
 </tbody></table></div>`;
};

VIEWS.otras=()=>{
 const s=LS.get('subj','mat'); const x=SUBJECTS.find(a=>a.id===s)||SUBJECTS[0];
 return `
 <h2>${T('Adaptarlo a otras asignaturas','Adapting it to other subjects')}</h2>
 <p class="lede">${T('El mecanismo es el mismo en cualquier materia: un adulto cercano cuenta una vez en que se atascó y cómo salió. Elige una materia para ver un ejemplo.','The mechanism is the same in any subject: a familiar adult tells of a time they got stuck and how they got out. Choose a subject to see an example.')}</p>
 <div class="tabs2" id="sj">${SUBJECTS.map(a=>`<button data-s="${a.id}" aria-pressed="${a.id===x.id}">${T(a.n.es,a.n.en)}</button>`).join('')}</div>
 <div class="grid2">
  <div class="card pale"><strong>${T('Invitado posible','Possible guest')}</strong><p style="margin:6px 0 0">${T(x.g.es,x.g.en)}</p></div>
  <div class="card pale"><strong>${T('Pregunta ancla para los estudiantes','Anchor question for students')}</strong><p style="margin:6px 0 0">${T(x.q.es,x.q.en)}</p></div>
 </div>
 <p class="tiny" style="margin-top:12px">${T('Son ejemplos para pensar tu caso. El protocolo, el termómetro y la ficha del invitado se usan igual.','These are examples to help you think about your case. The protocol, thermometer and guest profile are used the same way.')}</p>
 <div class="tablewrap"><table><thead><tr><th>${T('Asignatura','Subject')}</th><th>${T('Invitado posible','Possible guest')}</th><th>${T('Pregunta ancla','Anchor question')}</th></tr></thead><tbody>
 ${SUBJECTS.map(a=>`<tr><td class="k">${T(a.n.es,a.n.en)}</td><td>${T(a.g.es,a.g.en)}</td><td>${T(a.q.es,a.q.en)}</td></tr>`).join('')}</tbody></table></div>`;
};

VIEWS.medir=()=>{
 const reg=LS.get('reg',[]).filter(r=>r.i!=null&&r.o!=null);
 return `
 <h2>${T('Cómo medir el efecto en tu colegio','How to measure the effect at your school')}</h2>
 <p class="lede">${T('Tres datos sencillos, que una persona del equipo de datos del colegio puede ayudar a consolidar.','Three simple data points that someone from your school’s data team can help consolidate.')}</p>
 <ul class="plain">
  <li><strong>${T('Termómetro de entrada y de salida','Entry and exit thermometer')}</strong> ${T('de cada visita (niveles 1 a 4 en la analogía elegida).','for each visit (levels 1 to 4 on the chosen analogy).')}</li>
  <li><strong>${T('Rúbrica socioafectiva','Socio-emotional rubric')}</strong> ${T('dos veces al año, al inicio y al final.','twice a year, at the start and at the end.')}</li>
  <li><strong>${T('Muro de estrategias:','Strategy wall:')}</strong> ${T('cuántas estrategias nombra el grupo y cuántas dicen haber probado.','how many strategies the group names and how many say they tried.')}</li></ul>
 <p>${T('Anota también los comentarios espontáneos de los estudiantes tal como los dicen, con fecha. Sirven para contar qué cambió y no se pueden reconstruir después.','Also write down students’ spontaneous comments exactly as they say them, with the date. They help tell what changed and cannot be reconstructed later.')}</p>
 <h3>${T('Tus datos hasta ahora','Your data so far')}</h3>
 ${reg.length?`<div class="bars2">${reg.map(r=>`<div class="it"><div>${esc(r.d||'—')}<br><span class="tiny">${esc(r.g||'')}</span></div><div>
   <div class="bar in" style="width:${r.i*22}%">${T('Entrada','Entry')} ${r.i}</div><div style="height:4px"></div><div class="bar out" style="width:${r.o*22}%">${T('Salida','Exit')} ${r.o}</div></div></div>`).join('')}</div>
   <p style="margin-top:14px"><strong>${T('Cambio promedio','Average change')}: ${(()=>{const d=reg.reduce((a,r)=>a+(r.o-r.i),0)/reg.length;return (d>0?'+':'')+d.toFixed(2)})()} ${T('puntos en','points over')} ${reg.length} ${T(reg.length===1?'visita':'visitas',reg.length===1?'visit':'visits')}</strong></p>`
  :`<div class="card pale"><p style="margin:0">${T('Aún no hay datos. Registra una visita en el paso Sesión y verás aquí el cambio entre la entrada y la salida.','There is no data yet. Log a visit in the Session step and you will see the change between entry and exit here.')}</p></div>`}`;
};

VIEWS.teo=()=>`
 <h2>${T('Base teórica','Theoretical basis')}</h2>
 <p class="lede">${T('Cuatro fuentes sostienen la propuesta. Cada una explica una parte del camino de la vulnerabilidad a la agencia lingüística.','Four sources support the proposal. Each explains part of the path from vulnerability to linguistic agency.')}</p>
 <ul class="plain srcs">${SOURCES.map(s=>`<li><strong>${s.a}</strong> ${T(s.d.es,s.d.en)} <a href="${s.u}" target="_blank" rel="noopener">${s.l}</a></li>`).join('')}</ul>
 <div class="box">${T('Idea que une las cuatro fuentes: si un estudiante ve que un adulto respetado pasó por lo mismo, baja el filtro afectivo, siente seguridad psicológica, tolera la vulnerabilidad y decide hablar.','The idea that joins the four sources: if a student sees that a respected adult went through the same thing, the affective filter goes down, psychological safety rises, vulnerability becomes tolerable and the student decides to speak.')}</div>
 <p class="tiny">${T('Marcela Toquica · SNL – MS · Colegio Nueva Granada. Este toolkit es una versión inicial; se amplía para AMISA 2027.','Marcela Toquica · SNL – MS · Colegio Nueva Granada. This toolkit is an initial version; it will be expanded for AMISA 2027.')}</p>`;

/* ===================== shell ===================== */
function renderSteps(){
 $('#steps').innerHTML=STEPS.map((s,i)=>`<button data-step="${i}" ${i===cur?'aria-current="step"':''} class="${i<cur?'done':''}"><b>${i+1}</b>${T(s.es,s.en)}</button>`).join('');
}
function renderPager(){
 const prev=cur>0?`<button class="btn ghost" data-step="${cur-1}">← ${T('Anterior','Previous')}: ${T(STEPS[cur-1].es,STEPS[cur-1].en)}</button>`:'<span></span>';
 const next=cur<STEPS.length-1?`<button class="btn" data-step="${cur+1}">${T('Siguiente','Next')}: ${T(STEPS[cur+1].es,STEPS[cur+1].en)} →</button>`:`<button class="btn" id="to-home">${T('Volver al inicio','Back to start')}</button>`;
 return `<div class="pager noprint">${prev}<span class="prog">${T('Paso','Step')} ${cur+1} ${T('de','of')} ${STEPS.length}</span>${next}</div>`;
}
function hintHtml(){
 if(LS.get('hint',false)) return '';
 return `<div class="hint noprint" id="hint"><span>${T('Pasa el cursor (o toca) sobre cualquier texto para ver su traducción. También puedes cambiar el idioma completo arriba, con ES / EN.','Hover over (or tap) any text to see its translation. You can also switch the whole language at the top with ES / EN.')}</span><button id="hint-x">${T('Entendido','Got it')}</button></div>`;
}
function show(i,scroll=true){
 cur=Math.max(0,Math.min(STEPS.length-1,i));
 if(timer.iv){clearInterval(timer.iv);timer.run=false;timer.iv=null}
 $('#home').style.display='none'; $('#app').style.display='block';
 $('#main').innerHTML=hintHtml()+VIEWS[STEPS[cur].k]()+renderPager();
 renderSteps(); bind(STEPS[cur].k); applyLang();
 history.replaceState(null,'','#'+(cur+1));
 if(scroll){window.scrollTo({top:0});$('#main').focus({preventScroll:true})}
 const b=$('#steps [aria-current]'); if(b) b.scrollIntoView({inline:'center',block:'nearest'});
}
function showHome(){$('#app').style.display='none';$('#home').style.display='flex';history.replaceState(null,'',location.pathname);window.scrollTo({top:0})}
function applyLang(){
 document.documentElement.lang=lang;
 $$('.tr').forEach(e=>e.textContent=e.dataset[lang]);
 $$('[data-ph-es]').forEach(e=>e.placeholder=e.dataset['ph'+(lang==='es'?'Es':'En')]);
 $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
 $('#hovlab').textContent=lang==='es'?'Traducción al pasar el cursor':'Translation on hover';
 $('#hovsw').checked=hover; document.body.classList.toggle('hov',hover);
 const mp=$('#mailprev'); if(mp) mp.textContent=mailText();
 const tp=$('#thprev'); if(tp) tp.textContent=thanksText();
 if($('#phases')) drawTimer();
}
function setLang(l){lang=l;LS.set('lang',l);applyLang()}

/* ===================== eventos por paso ===================== */
function bind(k){
 $$('[data-go]').forEach(b=>b.onclick=()=>show(+b.dataset.go));
 const hx=$('#hint-x'); if(hx) hx.onclick=()=>{LS.set('hint',true);$('#hint').remove()};
 if(k==='term'){
  $$('#an button').forEach(b=>b.onclick=()=>{const s=LS.get('thermo',{a:'clima',l:[null,null,null,null,null]});s.a=b.dataset.a;LS.set('thermo',s);show(cur,false)});
  $$('.lv').forEach(g=>$$('button',g).forEach(b=>b.onclick=()=>{const s=LS.get('thermo',{a:'clima',l:[null,null,null,null,null]});const i=+g.dataset.m,n=+b.dataset.n;s.l[i]=s.l[i]===n?null:n;LS.set('thermo',s);const y=scrollY;show(cur,false);scrollTo(0,y)}));
  $('#th-reset').onclick=()=>{LS.set('thermo',{a:(LS.get('thermo',{a:'clima'}).a),l:[null,null,null,null,null]});const y=scrollY;show(cur,false);scrollTo(0,y)};
  $('#th-copy').onclick=async e=>{const s=LS.get('thermo',{a:'clima',l:[]});const an=ANALOGIES.find(a=>a.id===s.a)||ANALOGIES[0];
    const t=`${L({es:'Termómetro',en:'Thermometer'})} · ${L(an.n)}\n`+MOMENTS.map((m,i)=>`${L(m)}: ${s.l[i]||'–'}`).join('\n');
    await copyText(t);flash(e.currentTarget,'Copiado','Copied')};
  $$('td.pick').forEach(c=>{const f=()=>{const r=LS.get('rubric',{});r[c.dataset.r]=r[c.dataset.r]===+c.dataset.n?null:+c.dataset.n;LS.set('rubric',r);const y=scrollY;show(cur,false);scrollTo(0,y)};c.onclick=f;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}});
  $$('[data-rf]').forEach(t=>t.oninput=()=>{const r=LS.get('refl',{});r[t.dataset.rf]=t.value;LS.set('refl',r)});
  $('#rf-copy').onclick=async e=>{const r=LS.get('refl',{});await copyText(REFL.map((q,i)=>`${i+1}. ${L(q)} ${r[i]||''}`).join('\n'));flash(e.currentTarget,'Copiado','Copied')};
  $('#rf-clear').onclick=()=>{LS.set('refl',{});show(cur,false)};
  const keep=()=>{const y=scrollY;show(cur,false);scrollTo(0,y)};
  $$('.emo-opts').forEach(g=>$$('button',g).forEach(b=>b.onclick=()=>{const e=LS.get('emo',{});const id=g.dataset.em;e[id]=e[id]||{l:null,w:[]};e[id].l=e[id].l===+b.dataset.lv?null:+b.dataset.lv;LS.set('emo',e);keep()}));
  $$('.words').forEach(g=>$$('button',g).forEach(b=>b.onclick=()=>{const e=LS.get('emo',{});const id=g.dataset.ew;e[id]=e[id]||{l:null,w:[]};const i=+b.dataset.wi;let w=e[id].w||[];w=w.includes(i)?w.filter(x=>x!==i):[...w,i].slice(-2);e[id].w=w;LS.set('emo',e);keep()}));
  $('#emo-reset').onclick=()=>{LS.set('emo',{});keep()};
  $('#emo-copy').onclick=async e=>{const s=LS.get('emo',{});const t=L({es:'Rúbrica emocional de la visita',en:'Emotional rubric for the visit'})+'\n'+EMO.map(m=>{const x=s[m.id]||{};return L(m.n)+': '+(x.l?x.l+' · '+L(m.d[x.l-1]):'–')+((x.w||[]).length?' ('+x.w.map(i=>L(EMOWORDS[i])).join(', ')+')':'')}).join('\n');await copyText(t);flash(e.currentTarget,'Copiado','Copied')};
 }
 if(k==='preg'){
  $$('#qf button').forEach(b=>b.onclick=()=>{LS.set('qf',b.dataset.f);show(cur,false)});
  $$('[data-q]').forEach(b=>b.onclick=()=>{let s=LS.get('qsel',[]);const id=b.dataset.q;s=s.includes(id)?s.filter(x=>x!==id):[...s,id];LS.set('qsel',s);const y=scrollY;show(cur,false);scrollTo(0,y)});
  $$('[data-rc]').forEach(b=>b.onclick=()=>{const c=LS.get('qcustom',[]);c.splice(+b.dataset.rc,1);LS.set('qcustom',c);const y=scrollY;show(cur,false);scrollTo(0,y)});
  $('#qc').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){const c=LS.get('qcustom',[]);c.push(e.target.value.trim());LS.set('qcustom',c);const y=scrollY;show(cur,false);scrollTo(0,y)}};
  $('#q-clear').onclick=()=>{LS.set('qsel',[]);LS.set('qcustom',[]);show(cur,false)};
  $('#q-copy').onclick=async e=>{const all=[];STUDENT_VOICE.forEach((q,i)=>all.push({id:'V'+i,q}));CATS.forEach(c=>c.q.forEach((q,i)=>all.push({id:c.id+i,q})));REAL_QUESTIONS.forEach((q,i)=>all.push({id:'R'+i,q}));
    const sel=LS.get('qsel',[]);const t=[...sel.map(id=>all.find(x=>x.id===id)).filter(Boolean).map(x=>L(x.q)),...LS.get('qcustom',[])].map((q,i)=>`${i+1}. ${q}`).join('\n');
    await copyText(t||'');flash(e.currentTarget,'Copiado','Copied')};
 }
 if(k==='inv'){
  $$('[data-map]').forEach(el=>{const f=()=>{const [i,fld]=el.dataset.map.split('.');const m=LS.get('map',{});m[i]=m[i]||{};m[i][fld]=el.type==='checkbox'?el.checked:el.value;LS.set('map',m)};el.oninput=f;el.onchange=f});
  $$('[data-mail]').forEach(el=>el.oninput=()=>{const m=LS.get('mail',{});m[el.dataset.mail]=el.value;LS.set('mail',m);$('#mailprev').textContent=mailText()});
  $('#mail-copy').onclick=async e=>{await copyText(mailText());flash(e.currentTarget,'Copiado','Copied')};
  $$('[data-fi]').forEach(el=>el.oninput=()=>{const f=LS.get('ficha',{});f[el.dataset.fi]=el.value;LS.set('ficha',f)});
  $('#fi-copy').onclick=async e=>{const f=LS.get('ficha',{});await copyText(FICHA.map(x=>`${L(x)}: ${f[x.id]||''}`).join('\n'));flash(e.currentTarget,'Copiado','Copied')};
  $$('[data-th]').forEach(el=>el.oninput=()=>{const t=LS.get('thanks',{});t[el.dataset.th]=el.value;LS.set('thanks',t);$('#thprev').textContent=thanksText()});
  $('#th-copy').onclick=async e=>{await copyText(thanksText());flash(e.currentTarget,'Copiado','Copied')};
  $('#gd-copy').onclick=async e=>{await copyText(GUIDE.map((g,i)=>`${i+1}. ${L(g)}`).join('\n'));flash(e.currentTarget,'Copiado','Copied')};
 }
 if(k==='ses'){
  $$('[data-chk]').forEach(c=>c.onchange=()=>{const s=LS.get('chk',{});s[c.dataset.chk]=c.checked;LS.set('chk',s);c.closest('li').classList.toggle('on',c.checked)});
  drawTimer();
  $('#tm-go').onclick=()=>{ if(timer.run){clearInterval(timer.iv);timer.run=false}else{timer.run=true;timer.iv=setInterval(()=>{timer.left=Math.max(0,timer.left-1);drawTimer();if(!timer.left){clearInterval(timer.iv);timer.run=false;drawTimer()}},1000)} drawTimer()};
  $('#tm-reset').onclick=()=>{clearInterval(timer.iv);timer.run=false;timer.left=PHASES.reduce((a,p)=>a+p.m,0)*60;drawTimer()};
  $('#r-add').onclick=()=>{const g=id=>$('#'+id).value.trim();const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:Math.max(1,Math.min(4,n))};
    if(!g('r-date')&&!g('r-guest'))return;const r=LS.get('reg',[]);r.push({d:g('r-date'),g:g('r-guest'),s:g('r-str'),i:num(g('r-in')),o:num(g('r-out')),c:g('r-com')});LS.set('reg',r);const y=scrollY;show(cur,false);scrollTo(0,y)};
  $('#r-clear').onclick=()=>{if(confirm(lang==='es'?'¿Borrar todo el registro?':'Clear the whole log?')){LS.set('reg',[]);show(cur,false)}};
  $('#r-csv').onclick=()=>{const r=LS.get('reg',[]);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const csv='﻿date,guest,strategies,entry,exit,comments\n'+r.map(x=>[x.d,x.g,x.s,x.i,x.o,x.c].map(q).join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='registro_sesiones.csv';a.click()};
 }
 if(k==='otras'){ $$('#sj button').forEach(b=>b.onclick=()=>{LS.set('subj',b.dataset.s);show(cur,false)}) }
 $$('[data-step]',$('#main')).forEach(b=>b.onclick=()=>show(+b.dataset.step));
 const th=$('#to-home'); if(th) th.onclick=showHome;
}
function drawTimer(){
 const total=PHASES.reduce((a,p)=>a+p.m,0)*60; const el=total-timer.left; let acc=0,idx=-1;
 PHASES.forEach((p,i)=>{const s=acc,e=acc+p.m*60;if(el>=s&&el<e)idx=i;acc=e});
 if(timer.left===0)idx=PHASES.length;
 const used=el>0||timer.run;
 const ph=$('#phases'); if(!ph)return;
 let a2=0;
 ph.innerHTML=PHASES.map((p,i)=>{const s=a2/60;a2+=p.m*60;const cls=used?(i===idx?'now':(i<idx?'past':'')):'';
   return `<div class="ph ${cls}"><span class="m">${s}–${s+p.m}′</span><span>${T(p.n.es,p.n.en)}</span><span>${T(p.w.es,p.w.en)}</span></div>`}).join('');
 const mm=String(Math.floor(timer.left/60)).padStart(2,'0'),ss=String(timer.left%60).padStart(2,'0');
 $('#tm').textContent=`${mm}:${ss}`;
 const tp=$('#tph'); if(tp){tp.innerHTML=idx>=0&&idx<PHASES.length&&used?T(PHASES[idx].n.es,PHASES[idx].n.en):(timer.left===0?T('Sesión terminada','Session finished'):T('Presiona Iniciar al comenzar la sesión','Press Start when the session begins'))}
 const g=$('#tm-go'); if(g) g.innerHTML=timer.run?T('Pausar','Pause'):T(used?'Continuar':'Iniciar',used?'Resume':'Start');
 $$('#phases .tr,#tph .tr,#tm-go .tr').forEach(e=>e.textContent=e.dataset[lang]);
}

/* ===================== tooltip de traducción ===================== */
const tip=$('#tip'); let tipTimer=null, tipEl=null;
function showTip(el){
 if(!hover) return;
 const other=lang==='es'?'en':'es'; const txt=el.dataset[other]; if(!txt||txt===el.dataset[lang])return;
 tip.innerHTML=`<b>${other.toUpperCase()}</b>${esc(txt)}`;
 tip.classList.add('on'); tipEl=el;
 const r=el.getBoundingClientRect(); const tw=tip.offsetWidth, th=tip.offsetHeight;
 let x=Math.min(Math.max(8,r.left),innerWidth-tw-8); let y=r.bottom+8; if(y+th>innerHeight-8) y=Math.max(8,r.top-th-8);
 tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){tip.classList.remove('on');tipEl=null;clearTimeout(tipTimer)}
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('.tr'); if(!el){if(tipEl)hideTip();return} if(el===tipEl)return; clearTimeout(tipTimer); tipTimer=setTimeout(()=>showTip(el),220)});
document.addEventListener('mouseout',e=>{const el=e.target.closest&&e.target.closest('.tr'); if(el&&!(e.relatedTarget&&el.contains(e.relatedTarget)))hideTip()});
document.addEventListener('click',e=>{ // táctil: tocar un texto muestra la traducción; tocar fuera la oculta
 if(!matchMedia('(hover:none)').matches)return;
 const el=e.target.closest('.tr'); if(el&&!e.target.closest('button,a,input,textarea,td.pick,label')){ if(tipEl===el)hideTip(); else showTip(el);} else hideTip();
});
window.addEventListener('scroll',()=>{if(tipEl&&!matchMedia('(hover:none)').matches)hideTip()},{passive:true});

/* ===================== arranque ===================== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-lang]'); if(b){setLang(b.dataset.lang); if($('#app').style.display==='block'){const y=scrollY;show(cur,false);scrollTo(0,y)}}});
$('#hovsw').onchange=e=>{hover=e.target.checked;LS.set('hover',hover);document.body.classList.toggle('hov',hover);if(!hover)hideTip()};
$('#h-start').onclick=()=>show(0);
$('#brand').onclick=showHome;
renderHome(); applyLang();
const m0=/^#(\d)$/.exec(location.hash); if(m0&&+m0[1]>=1&&+m0[1]<=STEPS.length) show(+m0[1]-1,false);
</script>
